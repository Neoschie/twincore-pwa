<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#0A0A0B">
  <title>TwinCore — Coming Soon</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#0A0A0B;color:#fff}
    body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:32px 20px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(100%,560px);text-align:center}
    .orb{width:76px;height:76px;margin:0 auto 26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 3%,#9fe8ff 10%,#4b78ff 35%,#7538d8 62%,#171127 100%);box-shadow:0 0 55px rgba(83,116,255,.38)}
    h1{margin:0;font-size:clamp(2.4rem,8vw,4.5rem);letter-spacing:-.055em;line-height:.95}
    p{margin:22px auto 0;max-width:440px;color:#aaaeb9;font-size:1.05rem;line-height:1.65}
    .status{display:inline-block;margin-top:30px;padding:9px 14px;border:1px solid #292a31;border-radius:999px;color:#d7d8df;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase}
  </style>
</head>
<body>
  <main>
    <div class="orb" aria-hidden="true"></div>
    <h1>TwinCore</h1>
    <p>Something powerful is taking shape. TwinCore is preparing for its official launch on iOS and Android.</p>
    <div class="status">Coming Soon</div>
  </main>
</body>
</html>
