<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#0A0A0B">
  <title>TwinCore — Coming Soon</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#0A0A0B;color:#fff}
    body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:32px 20px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(100%,560px);text-align:center}
    .brand-fire{position:relative;width:min(100%,520px);margin:0 auto 20px;isolation:isolate}
    .brand-video{display:block;width:100%;height:auto;position:relative;z-index:1}
    @media(prefers-reduced-motion:reduce){.brand-video{display:none}.brand-fire::after{content:"";display:block;position:relative;z-index:1;width:100%;aspect-ratio:3/2;background:url("/brand/twincore-neon-flame-infinity.png") center/contain no-repeat}}
    .brand-fire img{display:block;width:100%;height:auto;position:relative;z-index:1;filter:drop-shadow(0 0 16px rgba(130,95,255,.28));animation:fire-breathe 3.8s ease-in-out infinite alternate}
    .brand-fire::before{content:"";position:absolute;inset:14% 9% 28%;z-index:0;background:linear-gradient(90deg,rgba(255,38,160,.28),rgba(104,48,255,.15) 48%,rgba(0,180,255,.3));filter:blur(35px);animation:fire-glow 2.7s ease-in-out infinite alternate}
    .flame-field{position:absolute;inset:4% 2% 28%;z-index:0;pointer-events:none;overflow:hidden}
    .flame{position:absolute;bottom:4%;width:37%;height:78%;border-radius:45% 55% 35% 65%;filter:blur(22px);opacity:.5;transform-origin:center bottom;mix-blend-mode:screen;animation:flame-dance 2.1s ease-in-out infinite alternate}
    .flame.pink{left:9%;background:radial-gradient(ellipse at 50% 75%,rgba(255,80,180,.7),rgba(224,28,135,.38) 40%,transparent 75%)}
    .flame.blue{right:9%;background:radial-gradient(ellipse at 50% 75%,rgba(0,220,255,.75),rgba(20,80,255,.4) 40%,transparent 75%);animation-duration:2.8s;animation-delay:-1.2s}
    .flame.pink::after,.flame.blue::after{content:"";position:absolute;inset:15% 25% 0;border-radius:50%;background:inherit;filter:blur(12px);animation:flame-flicker 1.3s ease-in-out infinite alternate}
    @keyframes flame-dance{0%{transform:translateY(10px) rotate(-5deg) scale(.85,1);opacity:.35}50%{transform:translateY(-12px) rotate(4deg) scale(1.1,1.2);opacity:.65}100%{transform:translateY(-25px) rotate(-3deg) scale(.9,1.35);opacity:.42}}
    @keyframes flame-flicker{from{opacity:.3;transform:scale(.8)}to{opacity:.85;transform:scale(1.2)}}
    .embers{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2}
    .ember{position:absolute;bottom:25%;width:3px;height:3px;border-radius:50%;background:#ff77d5;box-shadow:0 0 9px currentColor;opacity:0;animation:ember-rise 4s linear infinite}
    .ember:nth-child(1){left:19%;color:#ff58a9;animation-delay:0s}
    .ember:nth-child(2){left:30%;color:#e78bff;animation-delay:1.1s}
    .ember:nth-child(3){left:72%;color:#35d5ff;background:#35d5ff;animation-delay:.5s}
    .ember:nth-child(4){left:82%;color:#5d8bff;background:#5d8bff;animation-delay:2s}
    .ember:nth-child(5){left:47%;color:#fff;background:#fff;animation-delay:2.8s}
    @keyframes fire-breathe{from{filter:brightness(.94) drop-shadow(0 0 12px rgba(120,85,255,.2))}to{filter:brightness(1.1) drop-shadow(0 0 25px rgba(120,85,255,.5))}}
    @keyframes fire-glow{from{opacity:.45;transform:scale(.94)}to{opacity:1;transform:scale(1.07)}}
    @keyframes ember-rise{0%{opacity:0;transform:translateY(0) scale(.5)}15%{opacity:.9}80%{opacity:.6}100%{opacity:0;transform:translateY(-120px) translateX(15px) scale(1.4)}}
    @media(prefers-reduced-motion:reduce){.brand-fire img,.brand-fire::before,.ember,.flame,.flame::after{animation:none}.ember{display:none}}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    h1{margin:0;font-size:clamp(2.4rem,8vw,4.5rem);letter-spacing:-.055em;line-height:.95}
    p{margin:22px auto 0;max-width:440px;color:#aaaeb9;font-size:1.05rem;line-height:1.65}
    .status{display:inline-block;margin-top:30px;padding:9px 14px;border:1px solid #292a31;border-radius:999px;color:#d7d8df;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase}
  </style>
</head>
<body>
  <main>
    <div class="brand-fire">
      <div class="flame-field" aria-hidden="true"><span class="flame pink"></span><span class="flame blue"></span></div>
      <video class="brand-video" autoplay muted loop playsinline preload="metadata" poster="/brand/twincore-neon-flame-infinity.png" aria-label="Animated TwinCore flaming infinity emblem">
        <source src="/brand/twincore-flames-approved.mp4" type="video/mp4">
        <img src="/brand/twincore-neon-flame-infinity.png" alt="TwinCore flaming infinity emblem and wordmark" width="1536" height="1024">
      </video>
      <div class="embers" aria-hidden="true"><span class="ember"></span><span class="ember"></span><span class="ember"></span><span class="ember"></span><span class="ember"></span></div>
    </div>
    <h1 class="sr-only">TwinCore — Coming Soon</h1>
    <p>Something powerful is taking shape. TwinCore is preparing for its official launch on iOS and Android.</p>
    <div class="status">Coming Soon</div>
  </main>
</body>
</html>
